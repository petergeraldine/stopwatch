<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Stopwatch</title>

  <!-- Manifest + Icons -->
  <link rel="manifest" href="/stopwatch/manifest.json" />
  <link rel="apple-touch-icon" href="/stopwatch/assets/Logo.png" />
  <link rel="icon" href="/stopwatch/favicon.svg" />

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    #root {
      display: flex;
      flex-direction: column;
      width: 90%;
      max-width: 400px;
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 0 12px rgba(0,0,0,0.1);
    }

    .timer {
      font-size: 3rem;
      text-align: center;
      margin-bottom: 20px;
    }

    .buttons {
      display: flex;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .buttons button {
      flex: 1;
      margin: 0 5px;
      padding: 12px;
      font-size: 1.1rem;
      border: none;
      border-radius: 8px;
      background: #007bff;
      color: white;
    }

    /* ⭐ FIX: shrink results font so they fit the allocated slot */
    .results {
      font-size: 0.8rem;
      line-height: 1.1;
      overflow: hidden;
      max-height: 150px;
    }
  </style>
</head>

<body>
  <div id="root"></div>

  <!-- Your compiled JS bundle -->
  <script type="module" crossorigin src="/stopwatch/assets/index-BCiVsbfu.js"></script>
</body>
</html>
