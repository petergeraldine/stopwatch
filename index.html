<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Stopwatch</title>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, system-ui;
      background: #f5f5f5;
    }

    #app {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      padding: 20px;
      box-sizing: border-box;
    }

    h1 {
      font-size: 24px;
      margin-top: 10px;
      text-align: center;
    }

    .main-number {
      font-size: 48px;
      font-weight: bold;
      margin: 20px 0;
    }

    .buttons {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
    }

    button {
      width: 120px;
      height: 50px;
      font-size: 20px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
    }

    #restart {
      background: #d9534f;
      color: white;
    }

    #go {
      background: #ccc;
    }

    .results {
      width: 100%;
      max-width: 400px;
      font-size: 20px;
      margin-top: 10px;
    }

    .results div {
      padding: 6px 0;
      border-bottom: 1px solid #ddd;
    }
  </style>
</head>

<body>
  <div id="app">
    <h1>How precise are your instincts?</h1>

    <div class="main-number" id="current">0.00000</div>

    <div class="buttons">
      <button id="restart">Restart</button>
      <button id="go">Go</button>
    </div>

    <div class="results" id="results"></div>
  </div>

  <script>
    let results = [];
    let startTime = null;

    const currentEl = document.getElementById("current");
    const resultsEl = document.getElementById("results");
    const restartBtn = document.getElementById("restart");
    const goBtn = document.getElementById("go");

    function updateResults() {
      resultsEl.innerHTML = results
        .map((r, i) => `<div>${i + 1}: ${r.toFixed(5)}</div>`)
        .join("");
    }

    restartBtn.onclick = () => {
      results = [];
      currentEl.textContent = "0.00000";
      updateResults();
    };

    goBtn.onclick = () => {
      if (!startTime) {
        startTime = performance.now();
        goBtn.textContent = "Stop";
      } else {
        const diff = (performance.now() - startTime) / 1000;
        results.push(diff);
        currentEl.textContent = diff.toFixed(5);
        updateResults();
        startTime = null;
        goBtn.textContent = "Go";
      }
    };
  </script>
</body>
</html>
