<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Stopwatch</title>

  <link rel="manifest" href="/stopwatch/manifest.json" />
  <link rel="apple-touch-icon" href="/stopwatch/assets/Logo.png" />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #0a1a3a; /* dark blue full-screen background */
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: env(safe-area-inset-top)
               env(safe-area-inset-right)

    #root {
      width: 100%;
      max-width: 420px;
      padding: 20px;
      box-sizing: border-box;
    }

    .results {
      font-size: 0.8rem;
      line-height: 1.1;
      overflow: hidden;
      max-height: 150px;
    }
  </style>
